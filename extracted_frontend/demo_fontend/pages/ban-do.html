<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản đồ tìm kiếm trẻ em thất lạc — TìmTrẻ.vn</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Custom CSS for specialized animations -->
  <link rel="stylesheet" href="../assets/css/main.css" />
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Be Vietnam Pro', 'sans-serif'] },
          colors: {
            primary: { DEFAULT: '#FF3B30', dark: '#E02B20', light: '#FFF0EF' },
            brand: { DEFAULT: '#0052FF', dark: '#003ECC', light: '#F0F4FF' },
            success: { DEFAULT: '#12B76A', dark: '#027A48', light: '#ECFDF3' },
            slate: {
              50: '#FAFAFB',
              100: '#F1F5F9',
              200: '#E2E8F0',
              300: '#CBD5E1',
              400: '#94A3B8',
              500: '#64748B',
              600: '#475569',
              700: '#334155',
              800: '#1E293B',
              900: '#0F172A'
            }
          },
          boxShadow: {
            'premium': '0 12px 30px -10px rgba(15, 23, 42, 0.04), 0 4px 12px -4px rgba(15, 23, 42, 0.02)',
            'premium-hover': '0 20px 40px -12px rgba(15, 23, 42, 0.08), 0 8px 16px -6px rgba(15, 23, 42, 0.03)',
            'glow-sos': '0 0 20px 2px rgba(255, 59, 48, 0.25)',
            'glow-brand': '0 0 20px 2px rgba(0, 82, 255, 0.15)'
          }
        }
      }
    }
  </script>
  
  <style>
    /* Ensure the body and HTML cover full viewport for map */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="font-sans text-slate-800 antialiased flex flex-col h-screen overflow-hidden">

<!-- TOPNAV (Compact for full map layout) -->
<nav class="bg-white border-b border-slate-100 flex-shrink-0 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
    <a href="../index.html" class="flex items-center gap-2.5 group">
      <div class="w-8.5 h-8.5 bg-gradient-to-tr from-primary to-primary-dark rounded-lg flex items-center justify-center text-white font-bold shadow-md shadow-primary/20 transform group-hover:scale-105 transition-all">
        <span class="text-white font-black text-sm">T</span>
      </div>
      <span class="font-black text-base tracking-tight text-slate-900">TìmTrẻ<span class="text-primary">.vn</span></span>
    </a>
    
    <div class="hidden md:flex items-center gap-8">
      <a href="../index.html" class="text-xs font-semibold text-slate-600 hover:text-primary transition-colors">Trang chủ</a>
      <a href="danh-sach.html" class="text-xs font-semibold text-slate-600 hover:text-primary transition-colors">Hồ sơ mất tích</a>
      <a href="ban-do.html" class="text-xs font-black text-primary relative py-1 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-0.5 after:bg-primary after:rounded-full">Bản đồ tìm kiếm</a>
      <a href="thong-ke.html" class="text-xs font-semibold text-slate-600 hover:text-primary transition-colors">Thống kê</a>
    </div>
    
    <div class="hidden md:flex items-center gap-3">
      <a href="dang-tin.html" class="bg-primary text-white text-xs font-extrabold px-4 py-2 rounded-xl hover:bg-primary-dark shadow transition-all">+ Báo tin tìm con</a>
    </div>
    
    <button onclick="toggleMenu()" class="md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-50 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  
  <!-- Mobile drawer -->
  <div id="mobile-menu" class="md:hidden hidden border-t border-slate-100 bg-white px-4 py-4 space-y-3 shadow-xl">
    <a href="../index.html" class="block text-sm font-semibold text-slate-700 hover:text-primary">Trang chủ</a>
    <a href="danh-sach.html" class="block text-sm font-semibold text-slate-700 hover:text-primary">Hồ sơ mất tích</a>
    <a href="ban-do.html" class="block text-sm font-bold text-primary">Bản đồ tìm kiếm</a>
    <a href="thong-ke.html" class="block text-sm font-semibold text-slate-700 hover:text-primary">Thống kê</a>
    <a href="dang-tin.html" class="block text-center font-bold bg-primary text-white py-2 rounded-xl hover:bg-primary-dark transition-all">+ Báo tin</a>
  </div>
</nav>

<!-- FULL VIEWPORT MAP CONTAINER -->
<div class="flex-1 relative z-10">
  
  <!-- The Leaflet map -->
  <div id="full-map" class="w-full h-full bg-slate-100"></div>
  
  <!-- FLOATING CONTROL PANEL (Premium glassmorphism Card) -->
  <div class="absolute top-4 left-4 z-40 max-w-sm w-[90%] sm:w-80 space-y-3 pointer-events-auto">
    
    <!-- Filter Card -->
    <div class="glass-premium p-4 sm:p-5 rounded-3xl shadow-premium border border-slate-200/50 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-200/40 pb-2">
        <h3 class="font-black text-slate-900 text-sm tracking-tight flex items-center gap-1.5">
          🌍 Bản Đồ Tìm Kiếm
        </h3>
        <span class="bg-primary/10 text-primary text-[9px] font-black uppercase px-2 py-0.5 rounded-full">REALTIME</span>
      </div>
      
      <!-- Quick search input in card -->
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" placeholder="Tìm theo tỉnh thành, quận huyện..." class="w-full pl-8 pr-3 py-2 border border-slate-200/70 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-primary focus:border-transparent bg-white/70" />
      </div>
      
      <!-- Categories toggle checkboxes -->
      <div class="space-y-2 text-xs">
        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Loại điểm hiển thị</div>
        
        <label class="flex items-center gap-2.5 cursor-pointer p-1.5 hover:bg-white/40 rounded-lg transition-colors">
          <input type="checkbox" checked class="accent-primary" />
          <span class="w-2.5 h-2.5 bg-primary rounded-full border border-white shadow-sm flex-shrink-0"></span>
          <span class="font-bold text-slate-700">Trẻ đang cần tìm (355)</span>
        </label>

        <label class="flex items-center gap-2.5 cursor-pointer p-1.5 hover:bg-white/40 rounded-lg transition-colors">
          <input type="checkbox" checked class="accent-[#F59E0B]" />
          <span class="w-2.5 h-2.5 bg-[#F59E0B] rounded-full border border-white shadow-sm flex-shrink-0"></span>
          <span class="font-bold text-slate-700">Địa bàn có manh mối (18)</span>
        </label>

        <label class="flex items-center gap-2.5 cursor-pointer p-1.5 hover:bg-white/40 rounded-lg transition-colors">
          <input type="checkbox" checked class="accent-success" />
          <span class="w-2.5 h-2.5 bg-success rounded-full border border-white shadow-sm flex-shrink-0"></span>
          <span class="font-bold text-slate-700">Trẻ đã đoàn tụ an toàn</span>
        </label>
      </div>
      
      <!-- Quick locating button -->
      <button onclick="locateMe()" class="w-full bg-slate-900 text-white font-extrabold text-xs py-2.5 rounded-xl hover:bg-slate-800 transition-colors shadow flex items-center justify-center gap-1">
        🛰️ Vị trí của tôi
      </button>
      
    </div>
    
  </div>
</div>

<script>
  function toggleMenu() {
    document.getElementById('mobile-menu').classList.toggle('hidden');
  }

  // Initialize main map tracking the country center
  const map = L.map('full-map', { zoomControl: false }).setView([16.0544, 108.2022], 6); // Da Nang center center
  
  // Custom Zoom Control placed to the bottom-right for thumb ease
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  // Mock markers for children
  const kidsList = [
    { name: "Nguyễn Văn An", age: 8, location: "Chợ Bình Tây, Q.6, TP.HCM", lat: 10.7553, lng: 106.6608, img: "https://api.dicebear.com/7.x/thumbs/svg?seed=An1&backgroundColor=ffdfbf" },
    { name: "Trần Thị Linh", age: 6, location: "Hồ Tây, Hà Nội", lat: 21.0504, lng: 105.8122, img: "https://api.dicebear.com/7.x/thumbs/svg?seed=Linh2&backgroundColor=b6e3f4" },
    { name: "Phạm Minh Đức", age: 12, location: "Mỹ Khê, Đà Nẵng", lat: 16.0689, lng: 108.2452, img: "https://api.dicebear.com/7.x/thumbs/svg?seed=Duc&backgroundColor=ffd5dc" },
    { name: "Lê Thị Hoa", age: 9, location: "Bến Ninh Kiều, Cần Thơ", lat: 10.0336, lng: 105.7876, img: "https://api.dicebear.com/7.x/thumbs/svg?seed=Hoa&backgroundColor=c0aede" },
    { name: "Ngô Tuấn Kiệt", age: 7, location: "KCN VSIP 2, Bình Dương", lat: 11.0558, lng: 106.6800, img: "https://api.dicebear.com/7.x/thumbs/svg?seed=Tuan&backgroundColor=d1fae5" }
  ];

  // Render lost children markers with red glowing pulse ring
  kidsList.forEach(kid => {
    const lostIcon = L.divIcon({
      className: 'pulse-dot',
      html: '<div style="width:14px;height:14px;background:#FF3B30;border:2px solid white;border-radius:50%;box-shadow:0 0 10px rgba(255,59,48,0.4);"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });

    const popupHtml = `
      <div class="flex gap-3 items-center min-w-[220px]">
        <div class="w-12 h-12 rounded-xl overflow-hidden bg-slate-900 border border-slate-200 flex-shrink-0">
          <img src="${kid.img}" class="w-full h-full object-cover" />
        </div>
        <div class="min-w-0">
          <div class="font-extrabold text-xs text-slate-900">${kid.name}</div>
          <div class="text-[10px] text-slate-400 font-bold mt-0.5">${kid.age} tuổi · 📍 Bị lạc ở:</div>
          <div class="text-[10px] text-slate-600 font-semibold truncate mt-0.5">${kid.location}</div>
          <a href="chi-tiet.html" class="inline-flex items-center gap-0.5 text-[10px] font-black text-primary hover:underline mt-1.5 uppercase">
            Hồ sơ chi tiết →
          </a>
        </div>
      </div>
    `;

    L.marker([kid.lat, kid.lng], { icon: lostIcon }).addTo(map).bindPopup(popupHtml);
  });

  // Locate the client device location
  function locateMe() {
    map.locate({ setView: true, maxZoom: 14 });
    map.on('locationfound', (e) => {
      const myIcon = L.divIcon({
        html: '<div style="width:14px;height:14px;background:#0052FF;border:2px solid white;border-radius:50%;box-shadow:0 0 0 4px rgba(0,82,255,0.25);"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      L.marker(e.latlng, { icon: myIcon }).addTo(map).bindPopup("<div class='font-bold text-xs p-1 text-slate-900'>🛰️ Vị trí hiện tại của bạn</div>").openPopup();
    });
    map.on('locationerror', () => alert('Không thể xác minh vị trí của bạn. Vui lòng cấp quyền truy cập GPS cho trình duyệt.'));
  }
</script>
</body>
</html>
